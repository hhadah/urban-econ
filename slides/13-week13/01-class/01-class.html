## The Flint Water Crisis: An Urban Economics Perspective

### The Geography of Vulnerability

**Pre-crisis conditions shaped who was exposed:**
- Population declined from 200,000 to 100,000 (deindustrialization)
- Majority Black population (~60%)
- ~40% poverty rate
- 1 in 6 homes abandoned

**Key insight**: Where you lived determined your exposure
- Older neighborhoods = older lead pipes = higher contamination
- Low-income residents less able to relocate
- Geographic sorting created differential vulnerability

---
## A series of unfortunate events that led to a crisis

### From Cost-Cutting to Contamination

#### State official took over the management of Flint

#### In a bid to save money, the water source was switched from the great lakes to the Flint river

#### The Flint river water was highly corrosive

#### To save more money, corrosion control treatment was not applied

  - Water authorities put a treatment in water to prevent lead from leaching into water from old pipes

#### Residents began to complain about water quality

  - Brown color
  - Bad smell
  - Health issues

---
## Doctor Mona Hanna observed a spike in lead levels in children

### As a pediatrician in Flint, she noticed a significant increase in blood lead levels among children

### She came to the conclusion that only one thing could have caused this spike in children from different neighborhoods, race, and income levels:

### The water

  
---
## Neighborhood Effects in the Flint Crisis

**Pre-Switch Geography Mattered:**
- Housing age distribution
- Property values and maintenance
- Infrastructure quality
- Distance from treatment centers

**Post-Switch Neighborhood Variation:**
- Lead levels tripled in some neighborhoods
- ~17% of homes exceeded 15 ppb federal limit
- \&gt;40% exceeded 5 ppb "serious problem" threshold
- Blood-lead levels in children doubled citywide, tripled in certain areas

---
## The Economics of Place-Based Exposure

#### Why Location Determined Health Outcomes

**1. Housing stock characteristics**
- Older homes → lead service lines
- Lower property values → deferred maintenance
- Concentrated in specific neighborhoods

**2. Immobility constraints**
- Poverty limits residential mobility
- Homeownership as trap during crisis
- Information asymmetries about contamination

**3. Institutional neglect**
- Under-resourced neighborhoods = weaker advocacy

---
## Long-Run Neighborhood Effects

### Health Impacts and Future Outcomes

**Immediate crisis (2014-2015):**
- Around 9,000 children exposed for 18 months
- 12 deaths from Legionnaires' disease

**Long-term neighborhood consequences:**
- Lead exposure → cognitive impairment
- Reduced educational attainment
- Lower lifetime earnings
- Perpetuates neighborhood disadvantage

**The urban economics lesson:** 

*Neighborhood effects matter*

---
## Urban Economics Takeaways

### Where You Live = What You're Exposed To

**The Flint case demonstrates:**

1. **Neighborhood quality is multidimensional**
   - Not just schools, crime, amenities
   - Also infrastructure, environmental hazards, institutional capacity

2. **Residential immobility amplifies shocks**
   - Poor residents can't easily relocate
   - Housing wealth trapped during crisis
   - Creates concentrated, persistent disadvantage

---
## Discussion Questions

1. How does the Flint crisis illustrate the concept of "neighborhood effects" in urban economics?

2. How might lead exposure perpetuate neighborhood disadvantage across generations?

3. What are the implications for infrastructure investment in other declining cities?

# Rx Kids: Universal Prenatal and Infant Cash Transfers

## The Rx Kids Program: An Overview

### Program Design
- **Location**: Flint, Michigan (launched January 2024)
- **First universal, unconditional prenatal &amp; infant cash transfer in US**
- **Eligibility**: All expectant mothers in Flint
- **Benefits**:
  - $1,500 one-time payment mid-pregnancy (~20 weeks)
  - $500/month for 12 months after birth
  - Total: $7,500 per family

### Key Features
- Near-universal take-up (~100% aggregate enrollment)
- &gt;90% enroll prenatally
- No means testing or behavioral conditions
- Administered by GiveDirectly nonprofit

## Prenatal Care Utilization Effects

#### Study Design
- **Sample**: 32,157 births across Flint and 21 matched Michigan cities (2021-2025)
- **Method**: Difference-in-differences using vital records data
- **Key Outcome**: Kessner Index (adequacy of prenatal care)

#### Main Findings

- **+9.1 percentage points** increase in adequate prenatal care (95% CI: 5.6-12.5)
- **-1.9 percentage points** reduction in no prenatal care (95% CI: -2.6 to -1.2)
- **+0.8 visits** increase in total prenatal visits (95% CI: 0.2-1.4)
- **+5.6 percentage points** increase in first trimester initiation (95% CI: 2.5-8.7)
